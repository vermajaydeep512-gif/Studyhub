<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Next Toppers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
  <!-- Left panel -->
  <div class="login-left glass">
    <h1 class="typewriter">NEXT TOPPERS</h1>
    <p>Prepare Yourself — CBSE Class 10</p>
    <ul class="motivation">
      <li>🎯 Study smarter with chapter-wise notes</li>
      <li>📚 Practice ACP & Quizzes</li>
      <li>🚀 Track your progress</li>
    </ul>
  </div>

  <!-- Right panel -->
  <div class="login-right glass">
    <h2>Login</h2>
    <p>Please enter your details to continue</p>
    <form onsubmit="doLogin(event)">
      <input id="name" class="input" placeholder="Full Name" required>
      <input id="email" class="input" type="email" placeholder="Email" required>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <select id="role" required>
        <option value="">Select Role</option>
        <option>User</option>
        <option>Admin</option>
      </select>
      <input id="password" class="input" type="password" placeholder="Password for Admin" >
      <button class="btn" type="submit">Enter</button>
    </form>
    <a class="btn ghost" href="index.html">← Back to Landing</a>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
